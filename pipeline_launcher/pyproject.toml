[project]
name = "pipeline-launcher"
dynamic = ["version"]
description = "Launch Nextflow pipelines across local, Slurm, AWS Batch, and GCP Batch environments"
requires-python = ">=3.10"

dependencies = [
    "click>=8.0",
    "typer>=0.9",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "boto3>=1.34",
    "google-cloud-batch>=0.17",
    "google-cloud-storage>=2.14",
    "cloudpathlib[s3,gs,azure]>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.21",
    "ruff~=0.16",
    "mypy>=1.9",
    "types-boto3[batch,s3]>=1.43.64",
]

[project.scripts]
xoos = "pipeline_launcher.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipeline_launcher = [
    "templates/*.jinja",
    "env/*.yaml",
    "env/*.yaml.template",
    "nextflow_config/*.config",
    "nextflow_config/env/*.config",
    "nextflow_config/env/*.config.template",
    "pipeline/xoosnf/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
