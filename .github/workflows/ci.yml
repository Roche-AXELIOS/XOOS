name: CI

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - id: small_variant_caller
            name: Small Variant Caller
            license: LicenseRef-XOOS-Public-License-1.0
          - id: pangenome_consensus_caller
            name: Pangenome Consensus Caller
            license: LicenseRef-XOOS-Public-License-1.0
          - id: demux
            name: Demux
            license: LicenseRef-XOOS-Public-License-1.0
          - id: read_collapser
            name: Read Collapser
            license: LicenseRef-XOOS-Public-License-1.0
          - id: alignment_metrics
            name: Alignment Metrics
            license: LicenseRef-XOOS-Public-License-1.0
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Set short SHA
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.module.id }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=XOOS ${{ matrix.module.name }}
            org.opencontainers.image.licenses=${{ matrix.module.license }}
      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.module.id }}
          build-contexts: |
            common=common
            vendor=vendor
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}+${{ env.SHA_SHORT }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
