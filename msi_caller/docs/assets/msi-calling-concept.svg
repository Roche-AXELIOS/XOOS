  <text x="112" y="119" class="panel-title">Measure repeat lengths at a microsatellite</text>

  <text x="165" y="161" class="label" text-anchor="middle">flanking sequence</text>
  <text x="480" y="161" class="label" text-anchor="middle">23 bp repeat</text>
  <text x="795" y="161" class="label" text-anchor="middle">flanking sequence</text>
  <rect x="330" y="168" width="300" height="42" rx="10" fill="none" stroke="#ed2f2f" stroke-width="2.5"/>

  <g class="sequence">
    <text class="flank-sequence" x="165" y="197" text-anchor="middle"><tspan fill="#16a05d">T</tspan><tspan fill="#df2d2d">CC</tspan><tspan fill="#16a05d">T</tspan><tspan fill="#1769b0">A</tspan></text>
    <text x="350" y="197" fill="#16a05d" textLength="260" lengthAdjust="spacingAndGlyphs">TTTTTTTTTTTTTTTTTTTTTTT</text>
    <text class="flank-sequence" x="795" y="197" text-anchor="middle"><tspan fill="#d79a00">G</tspan><tspan fill="#16a05d">T</tspan><tspan fill="#d79a00">G</tspan><tspan fill="#1769b0">A</tspan><tspan fill="#d79a00">G</tspan></text>

    <text class="flank-sequence" x="165" y="237" text-anchor="middle"><tspan fill="#16a05d">T</tspan><tspan fill="#df2d2d">CC</tspan><tspan fill="#16a05d">T</tspan><tspan fill="#1769b0">A</tspan></text>
