<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 980" role="img" aria-labelledby="title desc">
  <title id="title">How MSI calling works</title>
  <desc id="desc">Step 1 measures variable microsatellite repeat lengths between flanking sequences. Step 2 compares an MSS case where baseline and tumor distributions are similar with an MSI-H case where the tumor distribution shifts and broadens.</desc>
