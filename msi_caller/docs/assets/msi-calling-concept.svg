    <text class="flank-sequence" x="165" y="277" text-anchor="middle"><tspan fill="#16a05d">T</tspan><tspan fill="#df2d2d">CC</tspan><tspan fill="#16a05d">T</tspan><tspan fill="#1769b0">A</tspan></text>
