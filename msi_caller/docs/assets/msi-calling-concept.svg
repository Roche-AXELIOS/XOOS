        <rect x="391" y="566" width="14" height="34"/><rect x="407" y="588" width="14" height="12"/>
        <rect x="423" y="592" width="14" height="8"/>
      </g>
      <path class="normal-curve" d="M75 599 C120 599 155 599 195 595 C235 591 260 565 285 535 C303 512 320 500 333 500 C350 500 367 535 382 563 C400 586 417 591 430 592"/>
      <line x1="75" y1="600" x2="430" y2="600" stroke="#c6d2e2" stroke-width="1.5"/>
    </g>

