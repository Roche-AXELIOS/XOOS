  <style>
    .title{font:700 30px Arial,sans-serif;fill:#092b66}
    .panel{fill:#fff;stroke:#d4deeb;stroke-width:2}
    .number{fill:#2364c5}
    .number-text{font:700 17px Arial,sans-serif;fill:#fff;text-anchor:middle}
    .panel-title{font:700 20px Arial,sans-serif;fill:#142c50}
    .label{font:14px Arial,sans-serif;fill:#64748b}
    .legend{font:700 14px Arial,sans-serif;fill:#50627b}
    .axis{font:12px Arial,sans-serif;fill:#50627b;text-anchor:middle}
    .sequence{font:700 20px Arial,sans-serif}
    .flank-sequence{font-family:monospace;font-size:20px;font-weight:700;letter-spacing:2px}
    .normal-bar{fill:#e49a52}
