<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">STR caller workflow</title>
  <desc id="desc">Input BAM, reference FASTA, and optional repeat catalog are processed to produce required and optional STR caller outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#546e7a"/>
    </marker>
    <style>
      .layer { fill: #f5f5f5; stroke: #bdbdbd; stroke-width: 2; }
      .node { fill: #e3f2fd; stroke: #90caf9; stroke-width: 2; }
      .optional { fill: #e8f5e9; stroke: #81c784; stroke-width: 2; }
      .label { fill: #1a1a1a; font: 16px Arial, sans-serif; text-anchor: middle; }
      .layer-label { fill: #1a1a1a; font: bold 18px Arial, sans-serif; }
      .edge { stroke: #546e7a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .bus { stroke: #546e7a; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect class="layer" x="25" y="35" width="250" height="300" rx="12"/><text class="layer-label" x="45" y="68">Input layer</text>
  <rect class="node" x="55" y="95" width="190" height="52" rx="8"/><text class="label" x="150" y="127">Input BAM</text>
  <rect class="node" x="55" y="170" width="190" height="52" rx="8"/><text class="label" x="150" y="202">Reference FASTA</text>
  <rect class="node" x="55" y="245" width="190" height="52" rx="8"/><text class="label" x="150" y="267">Repeat catalog</text><text class="label" x="150" y="286" font-size="13">hg38 default</text>
  <rect class="layer" x="315" y="35" width="250" height="300" rx="12"/><text class="layer-label" x="335" y="68">Resource setup</text>
  <rect class="node" x="345" y="120" width="190" height="52" rx="8"/><text class="label" x="440" y="152">Sample sex and name</text>
  <rect class="node" x="345" y="215" width="190" height="52" rx="8"/><text class="label" x="440" y="247">Reference contigs</text>
  <rect class="layer" x="605" y="35" width="250" height="300" rx="12"/><text class="layer-label" x="625" y="68">Analysis</text>
  <rect class="node" x="635" y="155" width="190" height="72" rx="8"/><text class="label" x="730" y="187">Local realignment</text><text class="label" x="730" y="209">and STR genotyping</text>
  <rect class="layer" x="895" y="35" width="280" height="650" rx="12"/><text class="layer-label" x="915" y="68">Output layer</text>
  <rect class="node" x="925" y="95" width="220" height="46" rx="8"/><text class="label" x="1035" y="124">VCF</text>
  <rect class="node" x="925" y="155" width="220" height="46" rx="8"/><text class="label" x="1035" y="184">JSON</text>
  <rect class="node" x="925" y="215" width="220" height="46" rx="8"/><text class="label" x="1035" y="244">Metrics</text>
  <rect class="optional" x="925" y="295" width="220" height="46" rx="8"/><text class="label" x="1035" y="324">Optional realigned BAM</text>
  <rect class="optional" x="925" y="355" width="220" height="46" rx="8"/><text class="label" x="1035" y="384">Optional pileup SVGs</text>
  <rect class="optional" x="925" y="415" width="220" height="46" rx="8"/><text class="label" x="1035" y="444">Optional IGV FASTA/BAM</text>
  <rect class="optional" x="925" y="475" width="220" height="46" rx="8"/><text class="label" x="1035" y="504">Optional STR-region VCF</text>
  <path class="edge" d="M245 121 H280 V146 H345"/><path class="edge" d="M245 196 H300 V241 H345"/><path class="edge" d="M245 271 H315"/>
  <path class="edge" d="M535 146 H575 V191 H635"/><path class="edge" d="M535 241 H590 V207 H635"/>
  <path class="edge" d="M825 191 H875"/><path class="bus" d="M875 118 V498"/>
  <path class="edge" d="M875 118 H925"/><path class="edge" d="M875 178 H925"/><path class="edge" d="M875 238 H925"/>
  <path class="edge" d="M875 318 H925"/><path class="edge" d="M875 378 H925"/><path class="edge" d="M875 438 H925"/><path class="edge" d="M875 498 H925"/>
</svg>
